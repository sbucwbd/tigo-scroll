<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tigo Scroll</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- Scene 1 -->
    <section class="scene scene-one">

        <div class="scene-text">

            <h1>Ready to go?</h1>

            <p>
                Always ready to hit the road.
            </p>

        </div>


        <div class="video-layer">

         <video
            class="scene-video video-one"
            autoplay
            muted
            loop
            playsinline
             preload="auto">

    <source src="tigo-carkey.mp4" type="video/mp4">

</video>

        </div>


        <div class="scroll-hint">
            SCROLL ↓
        </div>

    </section>



    <!-- Scene 2 -->
    <section class="scene scene-two">

        <div class="scene-text">

            <h1>GET IN.</h1>

            <p>
                A new day starts behind the wheel.
            </p>

        </div>


        <div class="video-layer">

            <video
            class="scene-video video-two"
            autoplay
            muted
            loop
            playsinline
            preload="auto">

    <source src="tigo-open-door.mp4" type="video/mp4">

</video>

        </div>

    </section>



    <!-- Scene 3 -->
    <section class="scene scene-three">

        <div class="scene-text">

            <h1>Let’s go drifting!</h1>
             <p> The moment I grip the wheel, </p>
             <p>the world starts to rewrite itself.</p>

        </div>


        <div class="video-layer">

            <video
             class="scene-video video-three"
                autoplay
                muted
                loop
                playsinline
                preload="auto">

    <source src="tigo-driving.mp4" type="video/mp4">

</video>

        </div>

    </section>



    <script src="script.js"></script>

</body>

</html>
